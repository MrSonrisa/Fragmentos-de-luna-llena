
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #030611;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

.space {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(
        circle at center,
        #182747 0%,
        #0b1125 45%,
        #030611 100%
    );
}

#particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.content {
    position: relative;
    z-index: 2;
    text-align: center;
    opacity: 0;
    transform: scale(.85);
    animation: reveal 1.5s ease forwards;
    animation-delay: 2.5s;
}

.moon {
    width: 115px;
    height: 115px;
    margin: auto auto 35px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 35% 30%,
        #ffffff,
        #d8e2f7 45%,
        #8499c4 80%
    );
    box-shadow: 0 0 20px #dce8ff;
    animation: moonExplosion 3s ease forwards;
}

h1 {
    font-size: 23px;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 0 20px #b6ceff;
}

.subtitle {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 5px;
    color: #a9bddf;
}

.loading {
    width: 150px;
    height: 2px;
    margin: 35px auto 0;
    background: #273451;
    overflow: hidden;
}

.loading::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    background: white;
    animation: loading 2s infinite;
}

@keyframes moonExplosion {
    0% {
        transform: scale(.3);
        opacity: .3;
        box-shadow: 0 0 10px white;
    }
    65% {
        transform: scale(1.25);
        opacity: 1;
        box-shadow: 0 0 80px #dce8ff,
                    0 0 180px #7898db;
    }
    100% {
        transform: scale(1);
        box-shadow: 0 0 45px #dce8ff,
                    0 0 100px #7898db;
    }
}

@keyframes reveal {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes loading {
    from { transform: translateX(-110%); }
    to { transform: translateX(380%); }
}
</style>
</head>

<body>

<div class="space">
    <canvas id="particles"></canvas>

    <div class="content">
        <div class="moon"></div>

        <h1>Fragmentos</h1>
        <h1>de Luna Llena</h1>

        <div class="subtitle">
            UN UNIVERSO POR DESCUBRIR
        </div>

        <div class="loading"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

let stars = [];
let startTime = performance.now();
let expanding = false;

function resize() {
    const dpr = window.devicePixelRatio || 1;

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - .5) * 1.5,
        vy: (Math.random() - .5) * 1.5,
        size: Math.random() * 2 + .3,
        alpha: Math.random()
    }));
}

function animate(time) {
    const elapsed = time - startTime;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    expanding = elapsed > 1800;

    stars.forEach(star => {

        if (expanding) {
            const dx = star.x - window.innerWidth / 2;
            const dy = star.y - window.innerHeight / 2;

            star.x += dx * .012;
            star.y += dy * .012;
        } else {
            star.x += star.vx * .25;
            star.y += star.vy * .25;
        }

        star.alpha += (Math.random() - .5) * .04;
        star.alpha = Math.max(.15, Math.min(1, star.alpha));

        if (star.x < 0 || star.x > window.innerWidth ||
            star.y < 0 || star.y > window.innerHeight) {
            star.x = Math.random() * window.innerWidth;
            star.y = Math.random() * window.innerHeight;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,230,255,${star.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#a9c5ff';
        ctx.fill();
    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
